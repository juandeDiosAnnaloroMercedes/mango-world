
name: Import MANGO WORLD archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          unzip -q MANGO_WORLD_Ethereum_QA_v1.8.5.zip -d /tmp/mango
          PROJECT_DIR="$(dirname "$(find /tmp/mango -name package.json -print -quit)")"
          test -f "$PROJECT_DIR/package.json"
          rsync -a --exclude='.git/' --exclude='.github/' "$PROJECT_DIR"/ ./

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract MANGO WORLD v1.8.5"
            git push
          fi
